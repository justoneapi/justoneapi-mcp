name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled catalog release
        run: npm run verify:catalog
        env:
          JUSTONEAPI_PRIVATE_CATALOG_TERMS: ${{ secrets.JUSTONEAPI_PRIVATE_CATALOG_TERMS }}

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check Worker types
        run: npx wrangler types worker-configuration.d.ts --include-runtime false --check

      - name: Check build output
        run: test -f dist/src/index.js && test -f dist/src/worker.js
