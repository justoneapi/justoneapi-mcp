name: Publish npm next

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-next
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Require the main branch
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.19.0

      - name: Install from the lockfile
        run: npm ci

      - name: Validate the release candidate offline
        run: npm run prepublishOnly

      - name: Pack, clean-install, and smoke the CLI-only tarball
        run: bash scripts/verify-packed-cli.sh

      - name: Publish the next dist-tag with npm trusted publishing
        run: npm publish --access public --tag next
