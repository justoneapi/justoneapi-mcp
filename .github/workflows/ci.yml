name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Offline validation
        run: npm run validate:offline

      - name: Build CLI
        run: npm run build:cli

      - name: Build Worker bundle
        if: matrix.node-version != 20
        run: npm run build:worker

      - name: Verify npm package closure
        run: npm run verify:package

      - name: Pack, clean-install, and smoke the CLI
        run: bash scripts/verify-packed-cli.sh

      - name: Check Worker types
        if: matrix.node-version != 20
        run: npx wrangler types worker-configuration.d.ts --include-runtime false --check

      - name: Check build output
        run: test -f dist/src/index.js && test ! -e dist/src/worker.js

  verify-live-catalog:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Verify the current live OpenAPI catalog
        run: npm run verify:catalog
